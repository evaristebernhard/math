name: Distribution capacity algorithm paper
on:
  push:
    paths:
      - "distribution_capacity_algorithm/**"
      - ".github/workflows/distribution-capacity-paper.yml"
  pull_request:
    paths:
      - "distribution_capacity_algorithm/**"
      - ".github/workflows/distribution-capacity-paper.yml"
  workflow_dispatch:
jobs:
  paper-and-algorithm-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check exact cell-cover logic
        run: |
          cd distribution_capacity_algorithm
          python3 algorithm/connected_prefix.py
          python3 -m unittest discover -s algorithm/tests -v
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra
      - name: Compile manuscript
        run: make -C distribution_capacity_algorithm/paper paper
      - name: Attach PDF
        uses: actions/upload-artifact@v4
        with:
          name: distribution-capacity-algorithm-paper
          path: distribution_capacity_algorithm/paper/main.pdf
          if-no-files-found: error
