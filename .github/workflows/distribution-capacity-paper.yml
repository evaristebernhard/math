name: 配电网安全容量算法论文
on:
  push:
    paths:
      - "distribution_capacity_algorithm/**"
      - ".github/workflows/distribution-capacity-paper.yml"
  pull_request:
    paths:
      - "distribution_capacity_algorithm/**"
      - ".github/workflows/distribution-capacity-paper.yml"
  workflow_dispatch:
jobs:
  paper-and-algorithm-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test exact interval coverage
        run: |
          cd distribution_capacity_algorithm
          python3 algorithm/connected_prefix.py
          python3 -m unittest discover -s algorithm/tests -v
      - name: Install Chinese XeLaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk fonts-texgyre
      - name: Build Chinese manuscript
        run: make -C distribution_capacity_algorithm/paper paper
      - name: Upload Chinese PDF
        uses: actions/upload-artifact@v4
        with:
          name: distribution-capacity-paper-zh
          path: distribution_capacity_algorithm/paper/main.pdf
          if-no-files-found: error
